<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyber Bros × Banreservas</title>
<style>
:root{--bg:#050b1a;--bg2:#0b1d44;--fg:#e8f1ff;--mut:#9ab2da;--acc:#19e3ff;--card:rgba(16,28,60,.72);--line:rgba(120,190,255,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef4ff;--bg2:#d6e4ff;--fg:#0a1a3a;--mut:#41567e;--acc:#0a6bd6;--card:rgba(255,255,255,.75);--line:rgba(10,60,160,.25)}}
:root[data-theme="light"]{--bg:#eef4ff;--bg2:#d6e4ff;--fg:#0a1a3a;--mut:#41567e;--acc:#0a6bd6;--card:rgba(255,255,255,.75);--line:rgba(10,60,160,.25)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.deck{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
section{--c:var(--acc);min-height:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;gap:5vw;padding:56px 7vw;position:relative;overflow:hidden;background:transparent}
section.rev{flex-direction:row-reverse}
section.cover{flex-direction:column;text-align:center}
.orb{position:absolute;border-radius:50%;opacity:.35;background:radial-gradient(circle,var(--c),transparent 65%);will-change:transform;animation:float 9s ease-in-out infinite;pointer-events:none}
.o1{width:38vmax;height:38vmax;left:-12vmax;top:-12vmax}.o2{width:30vmax;height:30vmax;right:-10vmax;bottom:-10vmax;animation-delay:-4s}
@keyframes float{50%{transform:translate(30px,40px) scale(1.12)}}
section>*:not(.orb){position:relative;z-index:1}
.num{position:absolute!important;font-size:clamp(9rem,32vw,24rem);font-weight:900;color:transparent;-webkit-text-stroke:2px var(--c);opacity:.13;top:50%;transform:translateY(-50%);line-height:1;z-index:0!important;pointer-events:none}
section:not(.rev) .num{right:3vw}section.rev .num{left:3vw}
.who{display:flex;flex-direction:column;align-items:center;text-align:center;flex:0 0 auto;max-width:280px}
.av{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:4rem;position:relative;background:var(--card);margin-bottom:16px;transform:scale(1.8) rotate(-30deg);opacity:0;transition:transform .9s cubic-bezier(.2,1.5,.4,1),opacity .5s}
.av::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(var(--c),transparent 60%,var(--c));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.name{font-size:clamp(2rem,5vw,3.2rem);font-weight:900;color:var(--c);line-height:1.05}
.role{margin-top:6px;font-size:1rem;font-weight:700;color:var(--fg)}
.pill{margin-top:12px;font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;padding:5px 12px;border:1px solid var(--c);border-radius:99px;color:var(--c)}
.bub{max-width:620px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:20px;padding:26px 30px;font-size:clamp(1.05rem,2.3vw,1.5rem);line-height:1.55;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.bub .w{display:inline-block;opacity:0;transform:translateY(12px);transition:opacity .45s,transform .45s;margin-right:.28em}
.bub .w.b{color:var(--c);font-weight:800}
.bub .dir{display:block;font-size:.8rem;color:var(--mut);margin-bottom:8px;letter-spacing:.08em;text-transform:uppercase}
.who,.bub{transition:opacity .7s,transform .9s cubic-bezier(.2,.9,.25,1),filter .8s}
section:not(.on) .who{opacity:0;transform:translateX(-50px) scale(1.7);filter:blur(10px)}section.rev:not(.on) .who{transform:translateX(50px) scale(1.7)}
section:not(.on) .bub{opacity:0;transform:translateY(40px) scale(1.35);filter:blur(8px)}
section.on .av{transform:none;opacity:1}
section.on .w{opacity:1;transform:none}
h1{font-size:clamp(2.8rem,10vw,6.5rem);font-weight:900;line-height:1;background:linear-gradient(90deg,var(--c),#2f6bff);-webkit-background-clip:text;background-clip:text;color:transparent;transition:.9s}
.cover p{margin-top:16px;font-size:clamp(1rem,2.4vw,1.5rem);color:var(--mut);transition:.9s .3s}
.cover .shield{font-size:5rem;animation:pulse 2.4s ease-in-out infinite;transition:.9s}
@keyframes pulse{50%{transform:scale(1.12);filter:drop-shadow(0 0 20px var(--c))}}
section.cover:not(.on) h1,section.cover:not(.on) p,section.cover:not(.on) .shield{opacity:0;transform:scale(1.6);filter:blur(10px)}
.bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:4px;width:0;background:linear-gradient(90deg,#19e3ff,#7a5cff,#ff5fa2);z-index:9;transition:width .15s}
.dots{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:9}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer;transition:.3s}
.dots i.a{background:var(--dc);box-shadow:0 0 10px var(--dc);transform:scale(1.5)}
.hint{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--mut);z-index:9;letter-spacing:.1em}
@media (max-width:760px){section,section.rev{flex-direction:column;gap:22px;padding:44px 22px}.av{width:110px;height:110px;font-size:3rem}.bub{padding:20px}}
body.lite *{animation:none!important;transition:none!important}
body.lite .ck,body.lite .ok,body.lite .ok2,body.lite .code b,body.lite .chips b{opacity:1}
body.lite .trk i{width:var(--w,100%)}
.team{flex-direction:column;text-align:center;gap:20px}
.tg{display:grid;grid-template-columns:repeat(5,1fr);gap:18px 14px;max-width:900px;width:100%}@media (max-width:760px){.tg{grid-template-columns:repeat(3,1fr)}}
.lst{margin-top:8px;font-size:.78rem;font-weight:800;background:var(--c);color:#04101f;border-radius:99px;padding:3px 12px}
.tm em{font-style:normal;font-size:.72rem;font-weight:800;background:var(--c);color:#04101f;border-radius:99px;padding:1px 10px}
.tm{display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .6s calc(.4s + var(--i)*.09s),transform .8s cubic-bezier(.2,1.4,.4,1) calc(.4s + var(--i)*.09s)}
section:not(.on) .tm{opacity:0;transform:translateY(40px) scale(.7)}
.tm .av{width:88px;height:88px;font-size:2.4rem;margin:0 0 6px}
.tm b{color:var(--c)}.tm span{font-size:.74rem;color:var(--mut);line-height:1.25}
#gear{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:1.1rem;cursor:pointer;opacity:.35;transition:opacity .2s}
#gear:hover,#gear.o{opacity:1}
#panel{position:fixed;right:12px;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:20;display:none;flex-direction:column;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:220px}
#panel.o{display:flex}
#panel button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;font:inherit;font-size:.85rem}
#panel b{float:right;color:var(--acc)}
#tm{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:20;font:700 .85rem ui-monospace,monospace;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;display:none}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:99px;font-size:.85rem;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.s{opacity:1}

.right{display:flex;flex-direction:column;gap:16px;min-width:0}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;box-sizing:border-box}
.av img.logo{padding:14%;background:#000;object-fit:contain}
.ex{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;max-width:800px}.pics{display:flex;gap:12px;flex:0 0 auto;max-width:100%}
.pic{margin:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;flex:0 0 auto;min-width:0;max-width:100%;box-shadow:0 8px 30px rgba(0,0,0,.2);transition:opacity .7s .9s,transform .9s cubic-bezier(.2,.9,.25,1) .9s,filter .8s .9s}
.pic img{display:block;width:auto;max-width:100%;max-height:34vh;object-fit:contain;border-radius:8px}.pic.pt img{max-height:46vh}.pic.ls img{max-width:400px}
.n3 .pic img{max-height:26vh}
.pic figcaption{font-size:.78rem;color:#33415c;text-align:center;margin-top:6px}
section:not(.on) .pic{opacity:0;transform:translateY(40px) scale(1.6);filter:blur(8px)}
.clogo{width:min(230px,42vw);border-radius:28px;margin-bottom:10px;box-shadow:0 0 45px var(--c);animation:pulse 2.4s ease-in-out infinite;transition:.9s}
section.cover:not(.on) .clogo{opacity:0;transform:scale(2);filter:blur(10px)}
html{background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 75%) fixed}body{background:transparent}
.deck{position:relative;z-index:1}#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.demo{display:flex;flex-direction:column;gap:12px;flex:1 1 210px;min-width:0}.demo:not(.w3) .dc{flex:0 0 auto}.demo.w3{flex-direction:row;flex-wrap:wrap;flex-basis:100%;max-width:800px}
.dc{flex:1 1 190px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.88rem;text-align:left;transition:opacity .7s 1.2s,transform .9s cubic-bezier(.2,.9,.25,1) 1.2s,filter .8s 1.2s}
section:not(.on) .dc{opacity:0;transform:scale(1.5);filter:blur(8px)}
.dc h4{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--c);margin-bottom:8px}
.trk,.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.trk i,.bar i{display:block;height:100%;width:0;background:var(--c);border-radius:9px;transition:width .35s,background .35s}
section.on .trk i{animation:fill 2.4s 1.5s ease-out forwards}
@keyframes fill{to{width:var(--w,100%)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.8)}to{opacity:1;transform:none}}
.ck,.ok,.ok2,.code b,.chips b{opacity:0}
section.on .ck,section.on .ok,section.on .ok2,section.on .code b,section.on .chips b{animation:pop .5s both}
.ck::before{content:"✓";color:var(--c);margin-right:8px;font-weight:900}
.ok,.ok2{color:#2ee66a;font-weight:800;margin-top:8px}
.al{color:#ff5a5a;font-weight:700;margin-bottom:8px;animation:bl 1s infinite}@keyframes bl{50%{opacity:.4}}
.mr{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center;margin:5px 0}
.chips b{display:inline-block;margin:2px 6px 2px 0;padding:6px 12px;border:1px solid var(--c);border-radius:99px;color:var(--c);font-weight:700}
.net{position:relative;height:30px;display:flex;justify-content:space-between;align-items:center}
.net::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line)}
.net i{width:14px;height:14px;border-radius:50%;background:var(--c);position:relative}
.net s{position:absolute;left:0;top:11px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--c);animation:mv 1.8s linear infinite}
@keyframes mv{to{left:calc(100% - 8px)}}
.mut{color:var(--mut);margin-top:6px;font-size:.8rem}
.fw{position:relative;height:56px;overflow:hidden}
.fw u{position:absolute;left:55%;top:0;bottom:0;width:8px;border-radius:4px;background:#ff8a3d}
.fw s{position:absolute;left:0;width:10px;height:10px;border-radius:50%}
.fw .g{background:#2ee66a;animation:mv 3s linear infinite}
.fw .r{background:#ff4d4d;animation:blk 3s linear infinite}
@keyframes blk{0%{left:0;opacity:1}40%{left:calc(55% - 12px);opacity:1}48%{left:calc(55% - 12px);opacity:0;transform:scale(2.4)}100%{left:calc(55% - 12px);opacity:0}}
.enc{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.enc code{font-family:ui-monospace,monospace;color:var(--c);word-break:break-all}
.dts{min-height:1.6em;letter-spacing:3px;font-size:1.1rem}.lab{margin-top:6px;font-weight:800}
.code{display:flex;gap:6px}.code b{width:30px;height:38px;display:grid;place-items:center;border:1px solid var(--c);border-radius:8px;font-size:1.2rem}
.lap{width:min(500px,44vw,calc((100vh - 300px)*1.6));position:relative}
.lap .lid{background:#1b2236;border:3px solid #3a4a78;border-radius:14px 14px 4px 4px;padding:2.2% 2.2% 3%;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.lap .scr{container-type:inline-size;aspect-ratio:16/10;background:#fff;border-radius:6px;overflow:hidden;position:relative;color:#1b2540}
.lap .base{height:14px;background:#2a3350;border:3px solid #3a4a78;border-top:0;border-radius:0 0 18px 18px;width:112%;margin-left:-6%;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.lap .tb{height:9%;background:#e8ecf7;display:flex;align-items:center;gap:1.1cqw;padding:0 2cqw;font-weight:800;font-size:2.5cqw}
.lap .tb i{width:2cqw;height:2cqw;border-radius:50%;background:#ff6159}
.lap .tb i+i{background:#ffbd2e}
.lap .tb i+i+i{background:#28c940}
.lap .tb span{margin-left:1cqw}
.lap .bd{position:absolute;left:0;right:0;top:9%;bottom:0;font-size:2.8cqw}
.lap .bd>*,.lap .a{position:absolute}
.lap .rw{left:4cqw;width:92cqw;height:9cqw;border:.5cqw solid #1b2540;border-radius:2cqw;display:flex;align-items:center;padding:0 3cqw;gap:2cqw;font-weight:700;background:#fff}
.lap .b2{border:.5cqw solid #1b2540;border-radius:1.6cqw;background:#ffd23f;font-weight:800;display:grid;place-items:center;text-align:center}
.lap .dt{width:3cqw;height:3cqw;border-radius:50%;background:#ff4d4d;flex:none}
.lap .stt{margin-left:auto;position:relative;min-width:20cqw;text-align:center;font-size:2.3cqw;font-weight:800;padding:.8cqw 2cqw;border-radius:9cqw;border:.4cqw solid #ff4d4d;color:#ff4d4d}
.lap .stt i{font-style:normal}
.lap .ab{position:absolute;inset:0;display:grid;place-items:center}
.lap .trkb{width:100%;height:2.4cqw;background:#e8ecf7;border-radius:2cqw;overflow:hidden}
.lap .trkb i{display:block;height:100%;background:#2f6bff}
.lap .bx{width:5cqw;height:5cqw;border:.6cqw solid #1b2540;border-radius:1.2cqw;display:grid;place-items:center;font-size:3.4cqw;color:#fff;font-style:normal}
.lap .swt{margin-left:auto;width:14cqw;height:6cqw;border-radius:6cqw;background:#cfd6e8;position:relative;border:.4cqw solid #cfd6e8}
.lap .swt i{position:absolute;left:.6cqw;top:.6cqw;width:4.2cqw;height:4.2cqw;border-radius:50%;background:#fff;animation:kn .25s var(--t) forwards}
@keyframes kn{to{left:8cqw}}
.lap .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.lap .ok2{color:#1fa95b}
.lap .cur{width:4.4cqw;height:4.4cqw;z-index:9}
.lap .pop{opacity:0;animation:pp .45s var(--t,0s) both cubic-bezier(.2,1.5,.4,1)}
@keyframes pp{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.lap .fi{opacity:0;animation:fi .3s var(--t,0s) both}
@keyframes fi{to{opacity:1}}
.lap .type{width:0;overflow:hidden;white-space:nowrap;animation:ty var(--d,1.2s) steps(var(--n,10)) var(--t,0s) forwards}
@keyframes ty{to{width:calc(var(--n)*(1ch + var(--ls,0px)))}}
.lap .grow{width:0;animation:gw var(--d,1.2s) var(--t,0s) ease-out forwards}
@keyframes gw{to{width:var(--w)}}
.lap .tog{animation:tg .25s var(--t) forwards}
@keyframes tg{to{background:#2ecc71;border-color:#2ecc71;color:#fff}}
.lap .hd{animation:hd .3s var(--t) forwards}
@keyframes hd{to{opacity:0;visibility:hidden}}
.lap .pr{animation:pr .3s var(--t) both}
@keyframes pr{50%{transform:scale(.9)}}
.lap .fw{position:relative;height:100%;overflow:hidden;background:#eef2fb;border-radius:2cqw}
.lap .fw u{position:absolute;left:55%;top:0;bottom:0;width:1.4cqw;background:#ff8a3d}
.lap .fw s{position:absolute;left:0;width:2cqw;height:2cqw;border-radius:50%}
.lap .fw .g{background:#2ecc71;animation:mv 3s linear infinite}
.lap .fw .r{background:#ff4d4d;animation:blk 3s linear infinite}
@keyframes mv{to{left:calc(100% - 2cqw)}}
@keyframes blk{0%{left:0;opacity:1}40%{left:calc(55% - 3cqw);opacity:1}48%{left:calc(55% - 3cqw);opacity:0;transform:scale(2.4)}100%{opacity:0}}
.lap .px{animation:hd .1s 2.5s forwards}
.lap .py{opacity:0;animation:fi .1s 2.6s forwards}
.lap .pol{position:absolute;left:103%;top:4%;width:31%;cursor:zoom-in;background:#fff;padding:3% 3% 2%;border:3px solid #0d1530;box-shadow:0 10px 26px rgba(0,0,0,.5);transform:rotate(4deg);animation:pin .7s 1s both cubic-bezier(.2,1.4,.4,1);z-index:6}
.lap .pol img{width:100%;display:block}
.lap .pol small{display:block;text-align:center;font-size:.62rem;font-weight:800;color:#0d1530;margin-top:4px;line-height:1.2}
.lap .pol::before{content:"";position:absolute;top:-5%;left:32%;width:36%;height:8%;background:rgba(255,226,110,.85);transform:rotate(-4deg)}
@keyframes pin{from{opacity:0;transform:translateY(40px) rotate(-14deg) scale(.7)}}
.lap .ph{container-type:inline-size;position:absolute;left:103%;top:38%;width:22%;aspect-ratio:9/17;background:#0d1530;border-radius:5cqw;padding:5cqw 4cqw;box-shadow:0 10px 26px rgba(0,0,0,.5);animation:phn .6s 3.1s both cubic-bezier(.2,1.3,.4,1);z-index:6}
@keyframes phn{from{opacity:0;transform:translateX(60%) rotate(10deg)}}
.lap .pi{background:#fff;border-radius:3cqw;height:100%;display:grid;place-content:center;text-align:center;gap:6cqw;color:#1b2540;font-weight:700;font-size:9cqw}
.lap .pi b{font-size:15cqw;letter-spacing:.5cqw}
.right .lap{align-self:flex-start;transition:opacity .7s,transform .9s cubic-bezier(.2,.9,.25,1),filter .8s}
section:not(.on) .lap{opacity:0;transform:scale(1.5);filter:blur(10px)}
section:not(.on) .lap .scr *,section:not(.on) .lap .pol,section:not(.on) .lap .ph{animation:none!important}
.right .bub{font-size:clamp(.92rem,1.5vw,1.2rem);line-height:1.5;padding:18px 24px}
.lap .ph{border:2px solid #5b6ea8}
body.lite .lap .pop,body.lite .lap .fi{opacity:1}body.lite .lap .type{width:calc(var(--n)*(1ch + var(--ls,0px)))}body.lite .lap .grow{width:var(--w)}
body.lite .lap .tog{background:#2ecc71;border-color:#2ecc71;color:#fff}body.lite .lap .hd,body.lite .lap .px{visibility:hidden}body.lite .lap .py{opacity:1}body.lite .lap .cur{display:none}
@media (max-width:780px){.lap{width:86vw}.lap .pol,.lap .ph{display:none}}
@keyframes sm{0%{width:6%}34%{width:30%}35%{width:32%}70%{width:65%}100%{width:100%}}
@keyframes smc{0%,34%{background:#ff4d4d}35%,70%{background:#ffb020}71%,100%{background:#2ecc71}}
#zoom{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(3,8,20,.88);cursor:zoom-out}
#zoom.o{display:flex}
#zoom img{max-width:92vw;max-height:82vh;border:6px solid #fff;border-radius:8px;box-shadow:0 20px 60px #000;background:#fff;animation:zi .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes zi{from{transform:scale(.4);opacity:0}}
#zoom small{color:#fff;font-weight:700;font-size:.95rem}
.lap .pol u{text-decoration:none;font-weight:600;opacity:.6}
</style>
</head>
<body>

{n:"Melkis",r:"Network Infrastructure Specialist",e:"🌐",c:"#2ee6a6",s:"Cyber Bros",t:"As the ~Network ~Infrastructure ~Specialist, I build and maintain ~resilient ~networks that connect and support all your daily operations ~without ~interruptions."},
